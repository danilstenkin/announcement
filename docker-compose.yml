services:
  api:
    image: announcements-api:latest
    container_name: announce-api
    env_file: .env
    environment:
      - NO_PROXY=contactcenter.fortebank.com
      - no_proxy=contactcenter.fortebank.com
      - MINIO_ENDPOINT=minio:9000
    ports:
      - "8004:8004"
    extra_hosts:
      - "dl-ai-dev-app01-uv01.fortebank.com:172.23.19.130"
    depends_on:
      - minio
    networks:
      - announce_network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: announce-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - announce_network
    restart: unless-stopped

volumes:
  minio_data:
    name: announce_minio_data
    # external: true

networks:
  announce_network:
